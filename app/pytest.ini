[pytest]
# 测试根：app/tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
# 覆盖率（架构 §5.4 / §6.4：core/ 目标 ≥ 90%，UI 不卡）：
#   需先 `pip install pytest-cov`，再：`pytest --cov=core --cov-report=term-missing`
# 本 scaffold 默认不强制 --cov，避免未装 pytest-cov 时集合失败。
