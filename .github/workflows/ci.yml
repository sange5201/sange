# CI 钉版配置 — 扫雷·安卓版（Sprint 2 起用）
# 质量负责人建议：Python 3.11 + Kivy 2.3.x 钉定；core 覆盖率门禁 ≥90%；UI 烟雾独立 job。
# 流水线：core 单测 → UI 烟雾(Kivy headless+xvfb) → CLI 冒烟 → 云构建 APK(出 artifact)。
# 本机（Python 3.13.14，无 pytest/kivy，无 Android SDK）不可自验，CI 为唯一可信执行源。
# 触发：push 到 main/develop/epic/**、向 main/develop 开 PR、或 GitHub 网页手动 Run workflow。

name: CI

on:
  push:
    branches: [main, develop, "epic/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}        # 允许在 GitHub 网页手动触发

jobs:
  # ---------- core 纯逻辑：必跑，覆盖率门禁 ----------
  core:
    name: core unit + coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # Kivy 2.3.x 兼容版本（避开 3.13）
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Run core tests with coverage gate
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest tests/test_core \
            --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=90 \
            -v --tb=short 2>&1 | tee /tmp/pytest-out.txt
      - name: Dump failure tail to annotations (self-diagnostics)
        if: failure()
        run: |
          TAIL=$(tail -60 /tmp/pytest-out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3500)
          echo "::error title=pytest-tail::${TAIL:-no log captured}"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: app/coverage.xml
        continue-on-error: true

  # ---------- UI 烟雾：独立 job，仅 CI（Kivy headless + xvfb） ----------
  ui-smoke:
    name: UI smoke (Kivy headless + xvfb)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (xvfb / GL / SDL2 / Kivy 运行时)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgl1-mesa-dri libglu1-mesa libgl1 \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 \
            libgstreamer1.0-0
      - name: Install Kivy (pinned 2.3.x)
        run: |
          python -m pip install --upgrade pip
          pip install "kivy==2.3.*" pytest
      - name: Run UI smoke under xvfb
        working-directory: app
        env:
          # Kivy 2.x 无 headless 后端，xvfb 下必须用 sdl2；
          # 无头环境 metrics 自动检测返回 None（dpi2px TypeError），显式喂齐 DPI/density。
          KIVY_WINDOW: sdl2
          KIVY_NO_ARGS: "1"
          KIVY_DPI: "96"
          KIVY_METRICS_DENSITY: "1"
          KIVY_METRICS_FONTSCALE: "1"
        run: |
          # test_smoke.py 含模块级 importorskip 守卫：
          # Epic E 落地后此处真正运行 5 条 UI 烟雾断言（格数/揭示/长按/双击chord/暂停恢复）。
          set -o pipefail
          xvfb-run -a python -m pytest tests/test_ui -v --tb=short 2>&1 | tee /tmp/ui-out.txt
      - name: Dump UI failure tail to annotations (self-diagnostics)
        if: failure()
        run: |
          TAIL=$(tail -60 /tmp/ui-out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-3500)
          echo "::error title=ui-smoke-tail::${TAIL:-no log captured}"

  # ---------- 无 UI 可玩启动冒烟（Sprint 1 退出证明） ----------
  cli-smoke:
    name: CLI playable smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Boot CLI and quit
        working-directory: app
        run: |
          echo "q" | python scripts/cli_play.py --level 中级 --seed 42

  # ---------- 云构建 APK（buildozer，GitHub Actions 托管 Linux runner） ----------
  # 注：弃用 ArtemSBulgakov/buildozer-action@v1 —— 其 Docker 镜像 apt update 依赖的
  # openjdk-r PPA 在新版 Ubuntu(resolute) 无 Release 文件，上游已坏；改为 runner 直装。
  build-apk:
    name: Build Android APK (buildozer)
    runs-on: ubuntu-latest
    needs: [core, ui-smoke, cli-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system deps (p4a 工具链)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config cmake ccache cpio \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev build-essential
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0" buildozer
      - name: Provision Android SDK (reuse runner's preinstalled SDK)
        run: |
          # runner 已预装完整 SDK 于 /usr/local/lib/android/sdk，自带可用的
          # cmdline-tools/latest/bin/sdkmanager。buildozer.spec 通过 android.sdk_path
          # 指向它，避免 buildozer 自建 SDK 时 p4a 找不到 sdkmanager。
          # 这里只补装目标平台 + build-tools 并接受 license。
          SDK=/usr/local/lib/android/sdk
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;34.0.0" >/dev/null
          # 兼容 p4a 旧版对 tools/bin/sdkmanager 的检查：补一个 shim 转发到真实 sdkmanager
          mkdir -p "$SDK/tools/bin"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$SM" > "$SDK/tools/bin/sdkmanager"
          chmod +x "$SDK/tools/bin/sdkmanager"
          ls -l "$SDK/cmdline-tools"/*/bin/sdkmanager "$SDK/tools/bin/sdkmanager"
      - name: Build APK (android debug)
        working-directory: app
        env:
          BUILDOZER_ALLOW_ORG: "1"
        run: |
          buildozer android debug
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper-android-apk
          path: ./app/bin/*.apk
          if-no-files-found: warn
