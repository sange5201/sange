# CI 钉版配置 — 扫雷·安卓版（Sprint 1 起用）
# 质量负责人建议：Python 3.11 + Kivy 2.3.x 钉定；core 覆盖率门禁 ≥90%；UI 烟雾独立 job。
# 本机（Python 3.13.14，无 pytest/kivy）不可自验，CI 为唯一可信执行源。

name: CI

on:
  push:
    branches: [main, develop, "epic/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------- core 纯逻辑：必跑，覆盖率门禁 ----------
  core:
    name: core unit + coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # Kivy 2.3.x 兼容版本（避开 3.13）
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Run core tests with coverage gate
        working-directory: app
        run: |
          python -m pytest tests/test_core \
            --cov=core --cov-report=term-missing --cov-fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: app/coverage.xml
        continue-on-error: true

  # ---------- UI 烟雾：独立 job，仅 CI（Kivy headless + xvfb） ----------
  ui-smoke:
    name: UI smoke (Kivy headless + xvfb)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (xvfb / GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglu1-mesa
      - name: Install Kivy (pinned 2.3.x)
        run: |
          python -m pip install --upgrade pip
          pip install "kivy==2.3.*" pytest
      - name: Run UI smoke under xvfb
        working-directory: app
        env:
          KIVY_WINDOW: headless
        run: |
          # test_smoke.py 含模块级 importorskip 守卫：
          # Epic E 未落地时（core.game / presentation.* 缺失）整模块干净 skip，不误伤流水线。
          xvfb-run -a python -m pytest tests/test_ui -v

  # ---------- 无 UI 可玩启动冒烟（Sprint 1 退出证明） ----------
  cli-smoke:
    name: CLI playable smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Boot CLI and quit
        working-directory: app
        run: |
          echo "q" | python scripts/cli_play.py --level 中级 --seed 42
